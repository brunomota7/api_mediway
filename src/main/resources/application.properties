# =============================
# JWT Configuration
# =============================
jwt.public.key=classpath:public.pem
jwt.private.key=classpath:private.pem

# Enables the DATA.SQL for DATABASE
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =============================
# Database Configuration
# =============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_Mediway}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================
# JPA / Hibernate
# =============================
# O schema agora e' controlado pelo Flyway (src/main/resources/db/migration).
# ddl-auto=validate apenas confere que as entidades batem com o schema migrado;
# nunca aplica DDL automaticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================
# Flyway
# =============================
# spring.flyway.enabled=false porque a migration roda manualmente, de forma sincrona,
# em FlywayEarlyMigrationInitializer (ANTES do contexto Spring subir). Nesta versao do
# Spring Boot a integracao automatica flyway->JPA nao garante essa ordem (o Hibernate
# tenta validar o schema antes do FlywayMigrationInitializer rodar), entao a alternativa
# oficial e' disparar o Flyway manualmente antes do container ser inicializado.
spring.flyway.enabled=false
# baseline-on-migrate permite adotar o Flyway em bancos que ja existem (criados
# anteriormente via ddl-auto=update) sem tentar recriar tabelas que ja estao la.
# baseline-version=1 marca a propria V1__baseline_schema.sql como ja aplicada nesses
# bancos (ela reflete exatamente o schema que o Hibernate ja gerava); em um banco novo
# e vazio o baseline e' ignorado e a V1 roda normalmente, criando o schema do zero.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =============================
# Configuracao do Rabbitmq
# =============================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# =============================
# Configuracao SMTP
# =============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================
# Configuracao de logs
# =============================
logging.level.root=INFO
logging.level.br.com.mediway_api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/app.log
logging.file.path=logs
